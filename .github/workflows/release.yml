name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package offline app
        run: |
          zip -r "XiaoHammerChineseConverter-${GITHUB_REF_NAME}.zip" . \
            -x ".git/*" \
            -x ".github/*"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "XiaoHammerChineseConverter-${GITHUB_REF_NAME}.zip" \
            --title "XiaoHammer Chinese Converter ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
